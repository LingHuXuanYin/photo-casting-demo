# 模特卡片生成器 - 前端 nginx 配置
#
# 提供：
#   1. 静态文件托管（Vite build 产物）
#   2. SPA fallback（所有非 /api 路径都返回 index.html）
#   3. /api/* 反向代理到后端（容器名 model-card-server:3001）

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 允许大文件上传（IndexedDB 备份/恢复 + 大图）
    client_max_body_size 50M;

    # gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # 反向代理到后端
    # 容器名是 docker-compose service name
    location /api/ {
        proxy_pass http://model-card-server:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        # 渲染图片可能要几秒到十几秒
    }

    # 静态资源 + SPA fallback
    # Vite build 产物的 assets/ 目录是 hash 文件名，可以长缓存
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
