# 模特卡片生成器 - Docker Compose 配置
#
# 启动两个服务：
#   - model-card-server: 后端（Fastify + @napi-rs/canvas）
#   - model-card-web: 前端（Vite build + nginx 反代）
#
# 用法：
#   docker compose up -d --build      # 启动
#   docker compose down               # 停止
#   docker compose logs -f            # 看日志
#   docker compose restart            # 重启
#
# 飞牛OS 注意事项：
#   - 飞牛OS WebUI 占 80 端口，所以前端映射到 10001、服务端映射到 10002
#   - 容器间通信用 service name（model-card-server），不走宿主机端口
#   - 数据全在浏览器 IndexedDB，不在容器里，重启不丢

services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: model-card-server:latest
    container_name: model-card-server
    restart: unless-stopped
    # 服务端 API：宿主 10002 → 容器 3001
    # 同时只 expose 给容器内（web 反代会用到），通过 ports 暴露给宿主机
    ports:
      - "10002:3001"
    # 飞牛OS / 多数 NAS：限制内存防止渲染大画布时 OOM
    deploy:
      resources:
        limits:
          memory: 1G
    # 健康检查（用 ping 端点）
    # server 冷启动要 5-8 秒（@napi-rs/canvas 加载 + 4 个字体注册），
    # 飞牛OS / 弱 NAS 上可能更慢，所以放宽：
    #   - start_period 10s → 30s：第一次 health check 之前给 30 秒宽限
    #   - interval 30s → 10s：启动后 30 秒内每 10 秒检查一次
    #   - retries 3 → 6：失败容忍 6 次（60 秒窗口）
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/ping"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    # 渲染需要 50MB 上传（base64 图片），Fastify body limit 已设
    # 如果想保留导出的文件到 NAS 共享目录，可挂载：
    # volumes:
    #   - /vol1/1000/photo-design-exports:/app/exports

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    image: model-card-web:latest
    container_name: model-card-web
    restart: unless-stopped
    # 应用端：宿主 10001 → 容器 80
    ports:
      - "10001:80"
    depends_on:
      server:
        # 用 service_started 而不是 service_healthy：
        # server 容器起来（即使内部崩了）就让 web 启动，
        # UI 至少能看，导出/API 调用失败也比整个 stack 死掉强
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 256M

# 用 bridge 网络（容器间通过 service name 互通）
networks:
  default:
    name: model-card-net
