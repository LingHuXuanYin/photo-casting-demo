# 模特卡片生成器 - Docker Compose 配置
#
# 启动两个服务：
#   - model-card-server: 后端（Fastify + @napi-rs/canvas）
#   - model-card-web: 前端（Vite build + nginx 反代）
#
# 用法：
#   docker compose up -d --build      # 启动
#   docker compose down               # 停止
#   docker compose logs -f            # 看日志
#   docker compose restart            # 重启
#
# 飞牛OS 注意事项：
#   - 飞牛OS WebUI 占 80 端口，所以前端映射到 8080
#   - 容器间通信用 service name（model-card-server），不走宿主机端口
#   - 数据全在浏览器 IndexedDB，不在容器里，重启不丢

services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: model-card-server:latest
    container_name: model-card-server
    restart: unless-stopped
    expose:
      - "3001"
    # 飞牛OS / 多数 NAS：限制内存防止渲染大画布时 OOM
    deploy:
      resources:
        limits:
          memory: 1G
    # 健康检查（用 ping 端点）
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # 渲染需要 50MB 上传（base64 图片），Fastify body limit 已设
    # 如果想保留导出的文件到 NAS 共享目录，可挂载：
    # volumes:
    #   - /vol1/1000/photo-design-exports:/app/exports

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    image: model-card-web:latest
    container_name: model-card-web
    restart: unless-stopped
    # 飞牛OS WebUI 已占 80 端口，前端用 8080
    # 如需换端口，改这里 "宿主机端口:容器端口"
    ports:
      - "8080:80"
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M

# 用 bridge 网络（容器间通过 service name 互通）
networks:
  default:
    name: model-card-net
